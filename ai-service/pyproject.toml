[project]
name = "ai-service"
version = "0.1.0"
description = "Multi-agent stock research AI service using crewAI and Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
    "google-genai>=1.47.0",
    "crewai>=0.80.0",
    "crewai-tools>=0.14.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.1",
    "sse-starlette>=2.1.0",
]
